<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rezeptbuch</title>

<style>
:root {
    --bg-color: radial-gradient(circle at top, #111827 0%, #020617 65%);
    --text-color: #e2e8f0;
    --muted-text: #94a3b8;
    --card-bg: rgba(15, 23, 42, 0.92);
    --card-border: rgba(148, 163, 184, 0.18);
    --input-bg: #0f172a;
    --button-bg: #3b82f6;
    --button-hover: #2563eb;
    --button-delete-bg: #ef4444;
    --button-delete-hover: #dc2626;
    --shadow: 0 10px 30px rgba(2, 6, 23, 0.45);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
}

body {
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: calc(28px + var(--safe-top)) calc(20px + var(--safe-right)) calc(28px + var(--safe-bottom)) calc(20px + var(--safe-left));
    line-height: 1.45;
}

h1, h2, h3 {
    margin-top: 0;
}

p {
    margin: 8px 0;
}

ul {
    margin: 8px 0 0;
    padding-left: 20px;
}

input, textarea {
    margin: 5px 0;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: var(--input-bg);
    color: var(--text-color);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input:focus, textarea:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    margin: 5px;
    padding: 9px 14px;
    border: none;
    border-radius: 10px;
    background: var(--button-bg);
    color: var(--text-color);
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
    background: var(--button-hover);
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
}

button:active {
    transform: translateY(1px);
}

.ingredient-row {
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 1.6fr 0.9fr 0.9fr auto;
    gap: 8px;
    align-items: center;
}

.ingredient-row button {
    background: var(--button-delete-bg);
    margin: 0;
}

.ingredient-row button:hover {
    background: var(--button-delete-hover);
    box-shadow: 0 6px 16px rgba(220, 38, 38, 0.35);
}

.recipe {
    background: linear-gradient(180deg, rgba(30, 41, 59, 0.55), rgba(15, 23, 42, 0.75));
    border: 1px solid var(--card-border);
    padding: 16px;
    margin: 12px 0;
    border-radius: 16px;
    position: relative;
    box-shadow: var(--shadow);
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

#list.recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
    align-items: stretch;
}

#list.recipe-grid .recipe {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 200px;
    padding-bottom: 52px;
}

.recipe-card-title {
    margin: 0 0 10px;
    font-size: 1.15rem;
    line-height: 1.3;
    padding-right: 36px;
}

.recipe-card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
}

.recipe-card-badge {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(59, 130, 246, 0.18);
    color: #93c5fd;
    border: 1px solid rgba(59, 130, 246, 0.35);
}

.recipe-card-preview {
    margin: 0 0 10px;
    font-size: 0.92rem;
    line-height: 1.45;
    color: var(--text-color);
    opacity: 0.92;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.recipe-card-ingredients {
    margin: 0;
    font-size: 0.82rem;
    line-height: 1.4;
    color: var(--muted-text);
    flex: 1;
}

.recipe:hover {
    transform: translateY(-2px);
    border-color: rgba(59, 130, 246, 0.55);
    box-shadow: 0 16px 30px rgba(2, 6, 23, 0.55);
}

.recipe:hover .delete-button {
    display: inline-block;
}

.delete-button {
    display: none;
    background: var(--button-delete-bg);
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
}

.edit-button {
    position: absolute;
    bottom: 12px;
    right: 12px;
    margin-top: 0;
    z-index: 10;
}

.radial-wrapper {
    position: relative;
    width: 300px;
    height: 300px;
    margin: 40px auto;
    border-radius: 50%;
    isolation: isolate;
    touch-action: none;
    outline: none;
}

.radial-wrapper:focus-visible {
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.45);
    border-radius: 50%;
}

.radial-wrapper::before {
    content: "";
    position: absolute;
    inset: 30px;
    border-radius: 50%;
    border: 1px solid rgba(148, 163, 184, 0.3);
    background: radial-gradient(circle, rgba(37, 99, 235, 0.06), transparent 65%);
    z-index: -1;
}

.radial-pointer {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 14px solid #60a5fa;
    filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.6));
    z-index: 3;
}

#radial {
    position: absolute;
    inset: 0;
}

.center-display {
    position: absolute;
    top: 110px;
    left: 110px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: var(--button-bg);
    box-shadow: 0 0 25px rgba(59, 130, 246, 0.7);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    z-index: 2;
}

.center-display.pulse {
    animation: centerPulse 0.35s ease;
}

.center-display,
.radial-pointer {
    pointer-events: none;
}

.radial-item {
    position: absolute;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #1d4ed8;
    text-align: center;
    line-height: 32px;
    font-size: 0.82rem;
    font-weight: 600;
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
    user-select: none;
    cursor: pointer;
    transform: translate(-50%, -50%);
    transition: transform 0.18s ease, background 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
}

.radial-item:hover {
    background: #2563eb;
}

.radial-item:focus {
    outline: none;
}

.radial-item:focus-visible {
    box-shadow: 0 0 0 2px #e2e8f0, 0 0 12px rgba(59, 130, 246, 0.85);
    z-index: 4;
}

.radial-item.active {
    transform: translate(-50%, -50%) scale(1.5);
    background: #60a5fa;
    box-shadow: 0 0 16px rgba(96, 165, 250, 0.95);
    opacity: 1;
}

.radial-item.inactive {
    opacity: 0.68;
}

.radial-item.radial-item--await {
    opacity: 0.52;
}

.radial-item.radial-item--await:hover {
    opacity: 0.72;
}

.center-display.center-display--neutral {
    font-size: 1.65rem;
    font-weight: 300;
    letter-spacing: 0.06em;
    color: #94a3b8;
    box-shadow: 0 0 18px rgba(148, 163, 184, 0.25);
}

@media (hover: none) and (pointer: coarse) {
    .radial-item {
        width: 40px;
        height: 40px;
        line-height: 40px;
        font-size: 0.9rem;
    }
}

.search-container {
    margin-bottom: 20px;
    display: flex;
    gap: 8px;
    align-items: center;
}

.search-container input {
    flex: 1;
    margin: 0;
}

.app-shell {
    max-width: 980px;
    margin: 0 auto;
    padding-bottom: var(--app-bottom-pad, 0px);
}

.bottom-nav {
    display: none;
}

.bottom-nav__item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 48px;
    margin: 0;
    padding: 6px 4px;
    border-radius: 12px;
    background: transparent;
    color: var(--muted-text);
    font-size: 0.72rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.bottom-nav__item:hover {
    background: rgba(59, 130, 246, 0.12);
    color: var(--text-color);
}

.bottom-nav__item:focus-visible {
    outline: 2px solid #60a5fa;
    outline-offset: 2px;
    color: var(--text-color);
}

.bottom-nav__item--active {
    color: #93c5fd;
    background: rgba(59, 130, 246, 0.22);
}

.scroll-anchor {
    scroll-margin-top: calc(12px + var(--safe-top));
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 18px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.actions button {
    margin: 0;
}

.muted {
    color: var(--muted-text);
}

#list {
    margin-top: 10px;
}

@media (max-width: 600px) {
    #list.recipe-grid {
        grid-template-columns: 1fr;
    }
}

#detail-view {
    margin-top: 14px;
}

.app-shell[data-app-mode="browse"] #detail-view {
    display: none !important;
}

.app-shell[data-app-mode="detail"] #overview-mode {
    display: none;
}

.app-shell[data-app-mode="detail"] #detail-view {
    display: block;
    margin-top: 0;
}

.app-mode-banner {
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.2);
}

.app-mode-banner--browse {
    margin-top: 4px;
}

.app-mode-banner__eyebrow {
    display: block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #93c5fd;
    margin-bottom: 4px;
}

.app-mode-banner__line {
    font-size: 0.95rem;
    line-height: 1.4;
}

.back-btn {
    margin: 0 0 14px;
    padding: 10px 14px;
}

.detail-actions {
    margin-top: 20px;
    border-top: 1px solid #334155;
    padding-top: 10px;
}

#formContainer {
    margin-top: 20px;
}

#formContainer input,
#formContainer textarea {
    width: 100%;
    box-sizing: border-box;
}

.form-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.secondary-btn {
    background: #475569;
}

.secondary-btn:hover {
    background: #334155;
}

.danger-btn {
    background: var(--button-delete-bg);
}

.danger-btn:hover {
    background: var(--button-delete-hover);
    box-shadow: 0 6px 16px rgba(220, 38, 38, 0.35);
}

.hidden {
    display: none !important;
}

.app-brand {
    text-align: center;
    padding: 8px 4px 20px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    margin-bottom: 6px;
}

.app-brand__title {
    margin: 0;
    font-size: clamp(1.5rem, 4vw, 1.85rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: #f1f5f9;
}

.admin-card {
    margin-top: 18px;
    margin-bottom: 4px;
    padding: 18px 18px 16px;
    border: 1px solid rgba(59, 130, 246, 0.22);
    background: linear-gradient(165deg, rgba(30, 58, 138, 0.35), rgba(15, 23, 42, 0.88));
}

.admin-card__head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}

.admin-card__title {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 700;
}

.admin-card__badge {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
}

.admin-card__badge--out {
    color: #94a3b8;
    background: rgba(15, 23, 42, 0.6);
    border-color: rgba(148, 163, 184, 0.25);
}

.admin-card__badge--in {
    color: #bbf7d0;
    background: rgba(22, 101, 52, 0.45);
    border-color: rgba(74, 222, 128, 0.35);
}

.admin-card__lead {
    margin: 0 0 14px;
    font-size: 0.9rem;
    line-height: 1.45;
    max-width: 42rem;
}

.admin-label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted-text);
    margin-bottom: 6px;
}

.admin-login-form__row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: stretch;
}

.admin-login-form__row input[type="password"] {
    margin: 0;
    min-width: 0;
}

.admin-login-form__row button {
    margin: 0;
    padding-left: 18px;
    padding-right: 18px;
    white-space: nowrap;
}

.admin-logged-in__inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 16px;
    padding: 14px 16px;
    border-radius: 14px;
    background: rgba(22, 101, 52, 0.2);
    border: 1px solid rgba(74, 222, 128, 0.28);
}

.admin-logged-in__inner > div:first-of-type {
    flex: 1;
    min-width: 160px;
}

.admin-logged-in__inner button {
    margin: 0;
}

.admin-logged-in__title {
    display: block;
    font-size: 0.95rem;
    margin-bottom: 2px;
}

.admin-logged-in__hint {
    margin: 0;
    font-size: 0.82rem;
}

@media (max-width: 520px) {
    .admin-login-form__row {
        grid-template-columns: 1fr;
    }

    .admin-login-form__row button {
        width: 100%;
    }

    .admin-logged-in__inner {
        flex-direction: column;
        align-items: stretch;
    }

    .admin-logged-in__inner button {
        width: 100%;
    }
}

.animate-in {
    animation: fadeSlideIn 0.35s ease both;
}

.list-empty {
    text-align: center;
    color: var(--muted-text);
    padding: 24px 12px;
    border: 1px dashed rgba(148, 163, 184, 0.25);
    border-radius: 12px;
    margin-top: 10px;
}

#detail-ingredients-list li {
    animation: listItemIn 0.28s ease both;
}

@keyframes fadeSlideIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes listItemIn {
    from {
        opacity: 0;
        transform: translateX(-6px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes centerPulse {
    0% { transform: scale(1); }
    45% { transform: scale(1.08); }
    100% { transform: scale(1); }
}

@media (max-width: 768px) {
    :root {
        --app-bottom-pad: calc(72px + var(--safe-bottom));
    }

    body {
        padding-top: calc(16px + var(--safe-top));
        padding-right: calc(12px + var(--safe-right));
        padding-bottom: var(--safe-bottom);
        padding-left: calc(12px + var(--safe-left));
    }

    .radial-wrapper {
        transform: scale(0.9);
        margin: 12px auto 24px;
    }

    .ingredient-row {
        grid-template-columns: 1fr;
    }

    .edit-button,
    .delete-button {
        position: static;
        display: inline-block;
        margin-right: 8px;
    }

    .bottom-nav {
        display: flex;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 200;
        justify-content: space-around;
        align-items: stretch;
        gap: 4px;
        padding: 8px max(8px, var(--safe-left)) max(10px, calc(8px + var(--safe-bottom))) max(8px, var(--safe-right));
        background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-top: 1px solid rgba(148, 163, 184, 0.22);
        box-shadow: 0 -10px 36px rgba(2, 6, 23, 0.55);
    }

    #detail-view,
    #formContainer {
        padding-bottom: calc(20px + var(--safe-bottom) + 72px);
    }

}
</style>
</head>

<body>
<div class="app-shell" id="appShell" data-app-mode="browse">

<div id="overview-mode" aria-hidden="false">

<header class="app-brand">
    <h1 class="app-brand__title">Rezeptbuch</h1>
</header>

<div class="app-mode-banner app-mode-banner--browse">
    <span class="app-mode-banner__eyebrow">Übersicht</span>
    <span class="app-mode-banner__line muted">Schnell browsen und suchen</span>
</div>

<!-- RAD -->
<div class="radial-wrapper scroll-anchor" id="letterWheel" tabindex="0" role="group" aria-label="Buchstabenfilter: Ziehen oder Mausrad zum Wählen, loslassen lädt passende Rezepte. Pfeiltasten drehen das Rad.">
    <div class="radial-pointer" aria-hidden="true"></div>
    <div id="radial" aria-hidden="true"></div>
    <div id="centerLetter" class="center-display center-display--neutral" aria-live="polite" aria-atomic="true" aria-label="Kein Buchstabe gewählt">–</div>
</div>

<!-- HEADER -->
<div class="section-header card scroll-anchor" id="recipeSection">
    <h2>Rezepte</h2>
    <div class="actions">
        <button type="button" class="admin-only hidden" onclick="toggleForm()" aria-label="Add Recipe">+ Rezept</button>
        <button type="button" onclick="loadAllRecipes()">Alle Rezepte anzeigen</button>
    </div>
</div>

<!-- SEARCH CONTAINER -->
<div class="search-container card scroll-anchor" id="searchSection">
    <input id="searchInput" placeholder="Suche nach Rezepten..." aria-label="Search Recipes">
    <button onclick="performSearch()">Suchen</button>
</div>

<section id="admin-panel" class="card admin-card scroll-anchor" aria-labelledby="admin-heading">
    <div class="admin-card__head">
        <h2 id="admin-heading" class="admin-card__title">Bearbeiten</h2>
        <span id="admin-status-badge" class="admin-card__badge admin-card__badge--out" aria-live="polite">Nur Lesen</span>
    </div>
    <p id="admin-card-lead" class="admin-card__lead muted">Zum Anlegen, Ändern oder Löschen von Rezepten bitte anmelden.</p>
    <div id="admin-login-fields">
        <label class="admin-label" for="adminPassword">Passwort</label>
        <div class="admin-login-form__row">
            <input type="password" id="adminPassword" placeholder="Admin-Passwort eingeben" autocomplete="current-password">
            <button type="button" onclick="adminLogin()">Anmelden</button>
        </div>
    </div>
    <div id="admin-logged-in" class="admin-logged-in hidden">
        <div class="admin-logged-in__inner">
            <div>
                <strong class="admin-logged-in__title">Angemeldet</strong>
                <p class="admin-logged-in__hint muted">Rezepte können bearbeitet werden.</p>
            </div>
            <button type="button" onclick="adminLogout()" class="secondary-btn">Abmelden</button>
        </div>
    </div>
</section>

<!-- FORM -->
<div id="formContainer" class="card" style="display:none;" aria-labelledby="recipe-form">
    <input type="hidden" id="recipeId">
    <input id="title" placeholder="Titel" aria-label="Recipe Title">
    <input id="servings" type="number" value="1" aria-label="Servings">
    <textarea id="desc" placeholder="Beschreibung" aria-label="Recipe Description"></textarea>

    <h3>Zutaten</h3>
    <div id="ingredients" aria-label="Ingredients List"></div>

    <button onclick="addIngredient()" aria-label="Add Ingredient">+ Zutat</button>
    <div class="form-actions">
        <button onclick="save()" id="saveButton">Speichern</button>
        <button onclick="toggleForm()" class="secondary-btn">Abbrechen</button>
    </div>
</div>

<!-- LIST -->
<div id="list" aria-labelledby="recipe-list"></div>

</div><!-- #overview-mode -->

<div id="detail-view" class="card" aria-hidden="true">
    <button type="button" class="back-btn" onclick="hideDetailView()">&larr; Zurück zur Übersicht</button>
    <div class="app-mode-banner app-mode-banner--detail">
        <span class="app-mode-banner__eyebrow">Rezept</span>
        <span class="app-mode-banner__line muted">Portionen anpassen</span>
    </div>

    <h2 id="detail-title">Titel des Rezepts</h2>
    <p id="detail-desc">Beschreibung...</p>
    <p id="detail-base-servings" class="muted"></p>
    <div style="margin-bottom: 20px;">
        <label for="detail-servings-input"><strong>Portionen:</strong></label>
        <input id="detail-servings-input" type="number" min="1" step="1" value="1" style="width: 90px;">
    </div>
    
    <div style="margin-bottom: 20px;">
        <strong>Zutaten:</strong>
        <ul id="detail-ingredients-list"></ul>
    </div>

    <div class="detail-actions admin-only hidden">
        <button type="button" onclick="edit(currentRecipeId)" class="btn-edit">Bearbeiten</button>
        <button type="button" onclick="deleteRecipeById(currentRecipeId)" class="btn-delete danger-btn">Löschen</button>
    </div>
</div>

</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Hauptnavigation">
    <button type="button" class="bottom-nav__item bottom-nav__item--active" id="bottom-nav-rezepte" onclick="bottomNavGoRezepte()">Rezepte</button>
    <button type="button" class="bottom-nav__item" id="bottom-nav-suche" onclick="bottomNavGoSuche()">Suche</button>
    <button type="button" class="bottom-nav__item" id="bottom-nav-abc" onclick="bottomNavGoAbc()">A–Z</button>
    <button type="button" class="bottom-nav__item" id="bottom-nav-admin" onclick="bottomNavGoAdmin()">Admin</button>
</nav>

<script>
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

let isAdmin = false;

function apiFetch(url, options = {}) {
    const headers = { ...(options.headers || {}) };
    if (options.body && typeof options.body === "string" && !headers["Content-Type"]) {
        headers["Content-Type"] = "application/json";
    }
    return fetch(url, { credentials: "include", ...options, headers });
}

function updateAdminUI() {
    document.querySelectorAll(".admin-only").forEach(el => {
        el.classList.toggle("hidden", !isAdmin);
    });
    const loginFields = document.getElementById("admin-login-fields");
    const loggedIn = document.getElementById("admin-logged-in");
    if (loginFields) loginFields.classList.toggle("hidden", isAdmin);
    if (loggedIn) loggedIn.classList.toggle("hidden", !isAdmin);
    const badge = document.getElementById("admin-status-badge");
    if (badge) {
        badge.textContent = isAdmin ? "Redakteur" : "Nur Lesen";
        badge.classList.toggle("admin-card__badge--in", isAdmin);
        badge.classList.toggle("admin-card__badge--out", !isAdmin);
    }
    const lead = document.getElementById("admin-card-lead");
    if (lead) lead.classList.toggle("hidden", isAdmin);
}

function refreshAdminStatus() {
    return apiFetch("/admin/status")
        .then(res => res.json())
        .then(data => {
            isAdmin = !!data.authenticated;
            updateAdminUI();
        })
        .catch(() => {
            isAdmin = false;
            updateAdminUI();
        });
}

function isMobileBottomNav() {
    return typeof window.matchMedia === "function" && window.matchMedia("(max-width: 768px)").matches;
}

function setAppMode(mode) {
    const shell = document.getElementById("appShell");
    if (!shell) return;
    const isDetail = mode === "detail";
    shell.dataset.appMode = isDetail ? "detail" : "browse";
    const overviewEl = document.getElementById("overview-mode");
    const detailEl = document.getElementById("detail-view");
    if (overviewEl) overviewEl.setAttribute("aria-hidden", isDetail ? "true" : "false");
    if (detailEl) detailEl.setAttribute("aria-hidden", isDetail ? "false" : "true");
}

function setBottomNavActive(buttonId) {
    document.querySelectorAll(".bottom-nav__item").forEach(function(btn) {
        btn.classList.toggle("bottom-nav__item--active", btn.id === buttonId);
    });
}

function clearBottomNavActive() {
    document.querySelectorAll(".bottom-nav__item").forEach(function(btn) {
        btn.classList.remove("bottom-nav__item--active");
    });
}

function bottomNavGoRezepte() {
    hideDetailView();
    const form = document.getElementById("formContainer");
    if (form && form.style.display !== "none") {
        form.style.display = "none";
    }
    const anchor = document.getElementById("recipeSection");
    if (anchor) {
        anchor.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    setBottomNavActive("bottom-nav-rezepte");
}

function bottomNavGoSuche() {
    hideDetailView();
    const section = document.getElementById("searchSection");
    if (section) {
        section.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    const input = document.getElementById("searchInput");
    if (input) {
        window.setTimeout(function() {
            input.focus({ preventScroll: true });
        }, 280);
    }
    setBottomNavActive("bottom-nav-suche");
}

function bottomNavGoAbc() {
    hideDetailView();
    const el = document.getElementById("letterWheel");
    if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        window.setTimeout(function() {
            try {
                el.focus({ preventScroll: true });
            } catch (err) {}
        }, 350);
    }
    setBottomNavActive("bottom-nav-abc");
}

function bottomNavGoAdmin() {
    hideDetailView();
    const el = document.getElementById("admin-panel");
    if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    if (!isAdmin) {
        window.setTimeout(function() {
            const pw = document.getElementById("adminPassword");
            const loginRow = document.getElementById("admin-login-fields");
            if (pw && loginRow && !loginRow.classList.contains("hidden")) {
                pw.focus({ preventScroll: true });
            }
        }, 320);
    }
    setBottomNavActive("bottom-nav-admin");
}

function adminLogin() {
    const pw = document.getElementById("adminPassword").value;
    apiFetch("/admin/login", {
        method: "POST",
        body: JSON.stringify({ password: pw })
    })
        .then(res => res.json().then(data => ({ ok: res.ok, data })))
        .then(({ ok, data }) => {
            if (ok) {
                document.getElementById("adminPassword").value = "";
                isAdmin = true;
                updateAdminUI();
                refreshAdminStatus();
            } else {
                alert(data.error || "Anmeldung fehlgeschlagen");
            }
        })
        .catch(() => alert("Anmeldung fehlgeschlagen"));
}

function adminLogout() {
    apiFetch("/admin/logout", { method: "POST" })
        .then(() => refreshAdminStatus())
        .then(() => {
            const form = document.getElementById("formContainer");
            if (form && form.style.display !== "none") {
                form.style.display = "none";
            }
        });
}

function handleUnauthorized() {
    isAdmin = false;
    updateAdminUI();
    alert("Nicht angemeldet oder Sitzung abgelaufen. Bitte erneut als Admin anmelden.");
}

let angle = 0;
let velocity = 0;
let isDragging = false;
let lastAngle = 0;
let currentLetter = letters[0];
let letterWheelCommitted = false;
let currentRecipeId = null;
let currentRecipeData = null;
let wheelSnapTimer = null;
let loadLetterDedup = { letter: "", t: 0 };

const menu = document.getElementById("radial");
const centerDisplay = document.getElementById("centerLetter");

function getWheelHost() {
    return document.getElementById("letterWheel");
}

function getAngleFromClient(clientX, clientY) {
    const wheel = getWheelHost();
    if (!wheel) return 0;
    const rect = wheel.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    return Math.atan2(clientY - cy, clientX - cx);
}

function getRadialOrbitMetrics() {
    const w = menu.offsetWidth || 300;
    const h = menu.offsetHeight || 300;
    const cx = w / 2;
    const cy = h / 2;
    const coarse = typeof window.matchMedia === "function" &&
        window.matchMedia("(hover: none) and (pointer: coarse)").matches;
    const inset = coarse ? 38 : 30;
    const rad = Math.max(44, Math.min(cx, cy) - inset);
    return { cx, cy, rad };
}

function buildWheel() {
    menu.innerHTML = "";
    letters.forEach(l => {
        const el = document.createElement("div");
        el.className = "radial-item";
        el.innerText = l;
        el.setAttribute("aria-hidden", "true");
        el.addEventListener("click", function(e) {
            e.stopPropagation();
            setWheelToLetter(l);
        });
        menu.appendChild(el);
    });
    updateWheel();
}

function updateWheel() {
    const items = document.querySelectorAll(".radial-item");
    const targetAngle = -Math.PI / 2;
    let activeIndex = 0;
    let minDiff = Number.POSITIVE_INFINITY;
    const { cx, cy, rad } = getRadialOrbitMetrics();

    items.forEach((item, i) => {
        const a = angle + (i / letters.length) * 2 * Math.PI;

        const x = cx + rad * Math.cos(a);
        const y = cy + rad * Math.sin(a);

        item.style.left = `${x}px`;
        item.style.top = `${y}px`;
        const diff = Math.abs(normalize(a - targetAngle));
        if (diff < minDiff) {
            minDiff = diff;
            activeIndex = i;
        }
    });

    const nextLetter = letters[activeIndex];

    if (!letterWheelCommitted) {
        currentLetter = nextLetter;
        items.forEach(function(item) {
            item.classList.remove("active", "inactive");
            item.classList.add("radial-item--await");
        });
        centerDisplay.innerText = "–";
        centerDisplay.classList.add("center-display--neutral");
        centerDisplay.setAttribute("aria-label", "Kein Buchstabe gewählt. Rad drehen oder einen Buchstaben antippen.");
        centerDisplay.classList.remove("pulse");
        return;
    }

    items.forEach(function(item) {
        item.classList.remove("radial-item--await");
    });

    const previousLetter = currentLetter;
    currentLetter = nextLetter;
    items.forEach((item, i) => {
        const isActive = i === activeIndex;
        item.classList.toggle("active", isActive);
        item.classList.toggle("inactive", !isActive);
    });

    if (previousLetter !== nextLetter) {
        centerDisplay.classList.remove("pulse");
        void centerDisplay.offsetWidth;
        centerDisplay.classList.add("pulse");
        if (typeof navigator.vibrate === "function") {
            try {
                navigator.vibrate(5);
            } catch (err) {}
        }
    }
    centerDisplay.classList.remove("center-display--neutral");
    centerDisplay.innerText = nextLetter;
    centerDisplay.setAttribute("aria-label", "Aktueller Buchstabe: " + nextLetter);
}

function normalize(a) {
    while (a > Math.PI) a -= 2 * Math.PI;
    while (a < -Math.PI) a += 2 * Math.PI;
    return a;
}

function getNearestSnapAngle(rawAngle) {
    const step = (2 * Math.PI) / letters.length;
    return Math.round(rawAngle / step) * step;
}

function animateToAngle(targetAngle, onDone = null) {
    function anim() {
        const diff = targetAngle - angle;
        if (Math.abs(diff) < 0.001) {
            angle = targetAngle;
            if (onDone) onDone();
            updateWheel();
            return;
        }
        angle += diff * 0.2;
        updateWheel();
        requestAnimationFrame(anim);
    }
    anim();
}

function setWheelToLetter(letter) {
    const index = letters.indexOf(letter);
    if (index === -1) return;
    letterWheelCommitted = true;
    const step = (2 * Math.PI) / letters.length;
    const targetAngle = (-Math.PI / 2) - (index * step);
    velocity = 0;
    animateToAngle(targetAngle, () => loadLetter(letter));
}

function beginDrag(clientX, clientY) {
    isDragging = true;
    lastAngle = getAngleFromClient(clientX, clientY);
}

function continueDrag(clientX, clientY) {
    if (!isDragging) return;
    const a = getAngleFromClient(clientX, clientY);

    const d = normalize(a - lastAngle);
    angle += d;
    velocity = d;
    lastAngle = a;
    updateWheel();
}

(function bindRadialWheel() {
    const host = getWheelHost();
    if (!host) return;

    host.addEventListener("mousedown", function(e) {
        if (e.button !== 0) return;
        beginDrag(e.clientX, e.clientY);
    });

    window.addEventListener("mousemove", function(e) {
        continueDrag(e.clientX, e.clientY);
    });

    window.addEventListener("mouseup", end);
    host.addEventListener("mouseleave", end);

    host.addEventListener("touchstart", function(e) {
        if (!e.touches.length) return;
        const t = e.touches[0];
        beginDrag(t.clientX, t.clientY);
    }, { passive: true });

    host.addEventListener("touchmove", function(e) {
        if (!e.touches.length) return;
        e.preventDefault();
        const t = e.touches[0];
        continueDrag(t.clientX, t.clientY);
    }, { passive: false });

    host.addEventListener("touchend", end, { passive: true });
    host.addEventListener("touchcancel", end, { passive: true });

    host.addEventListener("wheel", function(e) {
        e.preventDefault();
        angle += e.deltaY * 0.004;
        velocity = 0;
        updateWheel();

        if (wheelSnapTimer) {
            clearTimeout(wheelSnapTimer);
        }
        wheelSnapTimer = setTimeout(function() {
            snap();
        }, 140);
    }, { passive: false });
})();

function rotateWheelBy(delta) {
    const idx = letters.indexOf(currentLetter);
    if (idx === -1) return;
    const len = letters.length;
    const next = ((idx + delta) % len + len) % len;
    setWheelToLetter(letters[next]);
}

function setupLetterWheelKeyboard() {
    const host = getWheelHost();
    if (!host || host.dataset.keyboardBound === "1") return;
    host.dataset.keyboardBound = "1";
    host.addEventListener("keydown", function(e) {
        if (e.key === "ArrowRight" || e.key === "ArrowDown") {
            e.preventDefault();
            rotateWheelBy(1);
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
            e.preventDefault();
            rotateWheelBy(-1);
        } else if (e.key === "Home") {
            e.preventDefault();
            setWheelToLetter("A");
        } else if (e.key === "End") {
            e.preventDefault();
            setWheelToLetter("Z");
        } else if (e.key === "PageDown") {
            e.preventDefault();
            rotateWheelBy(5);
        } else if (e.key === "PageUp") {
            e.preventDefault();
            rotateWheelBy(-5);
        }
    });
}

function end() {
    if (!isDragging) return;
    isDragging = false;
    inertia();
}

function inertia() {
    velocity *= 0.95;
    angle += velocity;
    updateWheel();

    if (Math.abs(velocity) > 0.001) {
        requestAnimationFrame(inertia);
    } else snap();
}

function snap() {
    const target = getNearestSnapAngle(angle);
    animateToAngle(target, function() {
        letterWheelCommitted = true;
        loadLetter(currentLetter);
    });
}

function loadLetter(letter) {
    letterWheelCommitted = true;
    const now = Date.now();
    if (loadLetterDedup.letter === letter && now - loadLetterDedup.t < 200) {
        return;
    }
    loadLetterDedup = { letter: letter, t: now };
    apiFetch(`/recipes/${letter}`)
        .then(res => res.json())
        .then(data => {
            hideDetailView();
            render(data);
        });
}

function toggleForm() {
    const formContainer = document.getElementById("formContainer");
    if (formContainer.style.display === "none") {
        if (!isAdmin) {
            alert("Bitte zuerst als Admin anmelden.");
            return;
        }
        // Formular anzeigen
        formContainer.style.display = "block";
        
        // Prüfen, ob wir im "Bearbeiten"-Modus sind
        const recipeId = document.getElementById("recipeId").value;
        if (!recipeId) {
            // Neueingabe-Modus - alle Felder leeren
            document.getElementById("recipeId").value = "";
            document.getElementById("title").value = "";
            document.getElementById("desc").value = "";
            document.getElementById("servings").value = "1";
            document.getElementById("ingredients").innerHTML = "";
            document.getElementById("saveButton").innerText = "Speichern";
        }
    } else {
        // Formular ausblenden
        formContainer.style.display = "none";
    }
}

function addIngredient(name = '', amount = 0, unit = '') {
    const ingredientsDiv = document.getElementById("ingredients");
    const ingredientInput = document.createElement("div");
    ingredientInput.className = "ingredient-row";

    const nameInput = document.createElement("input");
    nameInput.placeholder = "Name";
    nameInput.ariaLabel = "Ingredient Name";
    nameInput.value = name;

    const amountInput = document.createElement("input");
    amountInput.type = "number";
    amountInput.placeholder = "Menge";
    amountInput.ariaLabel = "Ingredient Amount";
    amountInput.value = amount;

    const unitInput = document.createElement("input");
    unitInput.placeholder = "Einheit";
    unitInput.ariaLabel = "Ingredient Unit";
    unitInput.value = unit;

    const deleteButton = document.createElement("button");
    deleteButton.innerText = "-";
    deleteButton.onclick = function() {
        ingredientsDiv.removeChild(ingredientInput);
    };

    ingredientInput.appendChild(nameInput);
    ingredientInput.appendChild(amountInput);
    ingredientInput.appendChild(unitInput);
    ingredientInput.appendChild(deleteButton);

    ingredientsDiv.appendChild(ingredientInput);
}

function save() {
    const recipeId = document.getElementById("recipeId").value;
    const title = document.getElementById("title").value;
    const servings = parseInt(document.getElementById("servings").value, 10);
    const description = document.getElementById("desc").value;

    const ingredientsDiv = document.getElementById("ingredients");
    const ingredients = Array.from(ingredientsDiv.children).map(child => ({
        name: child.querySelector('input[placeholder="Name"]').value,
        amount: parseFloat(child.querySelector('input[placeholder="Menge"]').value),
        unit: child.querySelector('input[placeholder="Einheit"]').value
    }));

    let url, method;
    
    if (recipeId) {
        // Bearbeiten eines bestehenden Rezepts
        url = `/update/${recipeId}`;
        method = "PUT";
    } else {
        // Neues Rezept erstellen
        url = "/add";
        method = "POST";
    }

    if (!isAdmin) {
        alert("Bitte zuerst als Admin anmelden.");
        return;
    }

    apiFetch(url, {
        method: method,
        body: JSON.stringify({
            title,
            description,
            servings,
            ingredients
        })
    }).then(res => {
        if (res.status === 401) {
            handleUnauthorized();
            return null;
        }
        return res.json();
    })
      .then(data => {
          if (!data) return;
          if (data.status === "ok" || data.status === "updated") {
              alert(data.status === "ok" ? "Rezept erfolgreich gespeichert!" : "Rezept erfolgreich aktualisiert!");
              document.getElementById("recipeId").value = ""; 
              document.getElementById("title").value = ""; 
              document.getElementById("desc").value = "";
              document.getElementById("servings").value = "1";
              document.getElementById("ingredients").innerHTML = ""; 
              document.getElementById("saveButton").innerText = "Speichern"; 
              toggleForm();
              loadLetter(currentLetter);
          } else {
              alert(data.message || data.error || "Fehler beim Speichern/Ändern des Rezepts.");
          }
      })
      .catch(error => {
          console.error('Error:', error);
          alert('Ein Fehler ist aufgetreten');
      });
}

function edit(id) {
    if (!isAdmin) {
        alert("Bitte zuerst als Admin anmelden.");
        return;
    }
    hideDetailView();
    apiFetch(`/recipe/${id}`)
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                alert('Rezept nicht gefunden');
                return;
            }
            
            const recipe = data;
            document.getElementById("recipeId").value = recipe.id;
            document.getElementById("title").value = recipe.title;
            document.getElementById("servings").value = recipe.servings;
            document.getElementById("desc").value = recipe.description;

            // Zutatenfeld leeren und mit neuen Zutaten füllen
            const ingredientsDiv = document.getElementById("ingredients");
            ingredientsDiv.innerHTML = "";
            recipe.ingredients.forEach(ingredient => {
                addIngredient(ingredient.name, ingredient.amount, ingredient.unit);
            });

            // Speichern-Button Text ändern
            document.getElementById("saveButton").innerText = "Aktualisieren";
            
            // Formular anzeigen
            toggleForm();
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Fehler beim Laden des Rezepts');
        });
}

function showRecipeDetail(id) {
    apiFetch(`/recipe/${id}`)
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                alert('Rezept nicht gefunden');
                return;
            }

            currentRecipeId = data.id;
            currentRecipeData = data;

            const formEl = document.getElementById("formContainer");
            if (formEl && formEl.style.display !== "none") {
                formEl.style.display = "none";
            }
            setAppMode("detail");
            window.scrollTo({ top: 0, behavior: "smooth" });

            if (isMobileBottomNav()) {
                clearBottomNavActive();
            }
            const detailView = document.getElementById("detail-view");
            detailView.classList.remove("animate-in");
            void detailView.offsetWidth;
            detailView.classList.add("animate-in");
            document.getElementById("detail-title").innerText = data.title;
            document.getElementById("detail-desc").innerText = data.description || "Keine Beschreibung vorhanden.";
            document.getElementById("detail-base-servings").innerText = `Basis-Portionen: ${data.servings}`;

            const servingsInput = document.getElementById("detail-servings-input");
            servingsInput.value = data.servings;
            renderDetailIngredients(data.servings);
            updateAdminUI();
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Fehler beim Laden der Detailansicht');
        });
}

function hideDetailView() {
    setAppMode("browse");
    currentRecipeId = null;
    currentRecipeData = null;
    if (isMobileBottomNav()) {
        setBottomNavActive("bottom-nav-rezepte");
    }
}

function formatAmount(amount) {
    if (Number.isInteger(amount)) {
        return amount.toString();
    }
    return amount.toFixed(2).replace(/\.?0+$/, '');
}

function renderDetailIngredients(targetServings) {
    if (!currentRecipeData) return;

    const baseServings = currentRecipeData.servings || 1;
    const ratio = targetServings / baseServings;
    const ingredientsList = document.getElementById("detail-ingredients-list");
    ingredientsList.innerHTML = "";

    currentRecipeData.ingredients.forEach(ingredient => {
        const ingredientItem = document.createElement("li");
        const scaledAmount = ingredient.amount * ratio;
        ingredientItem.innerText = `${formatAmount(scaledAmount)} ${ingredient.unit} ${ingredient.name}`;
        ingredientItem.style.animationDelay = `${ingredientsList.children.length * 35}ms`;
        ingredientsList.appendChild(ingredientItem);
    });
}

function deleteRecipeById(id) {
    if (!isAdmin) {
        alert("Bitte zuerst als Admin anmelden.");
        return;
    }
    if (!confirm("Möchtest du dieses Rezept wirklich löschen?")) {
        return;
    }

    apiFetch(`/delete/${id}`, { method: "DELETE" })
        .then(res => {
            if (res.status === 401) {
                handleUnauthorized();
                return null;
            }
            return res.json();
        })
        .then(data => {
            if (!data) return;
            if (data.status === "deleted") {
                alert("Rezept erfolgreich gelöscht!");
                hideDetailView();
                loadLetter(currentLetter);
            } else {
                alert(data.error || "Fehler beim Löschen des Rezepts.");
            }
        });
}

function truncatePreview(text, maxChars) {
    const max = maxChars || 160;
    const t = String(text || "").trim().replace(/\s+/g, " ");
    if (!t) return "Keine Beschreibung.";
    if (t.length <= max) return t;
    return t.slice(0, max).trimEnd() + "…";
}

function ingredientPreviewLine(ingredients, maxNames) {
    const max = maxNames || 4;
    const list = Array.isArray(ingredients) ? ingredients : [];
    if (!list.length) return "Keine Zutaten eingetragen.";
    const parts = list.slice(0, max).map(function(i) {
        return (i && i.name) ? String(i.name).trim() : "";
    }).filter(Boolean);
    const line = parts.join(" · ");
    if (list.length > max) {
        return line + " … +" + (list.length - max) + " weitere";
    }
    return line || "Keine Zutaten eingetragen.";
}

function render(recipes) {
    const listDiv = document.getElementById("list");
    listDiv.innerHTML = "";
    listDiv.classList.remove("animate-in", "recipe-grid");
    void listDiv.offsetWidth;
    listDiv.classList.add("animate-in");

    if (!recipes.length) {
        const emptyState = document.createElement("div");
        emptyState.className = "list-empty";
        emptyState.innerText = "Keine Rezepte in dieser Ansicht. Buchstabenrad drehen oder antippen, suchen oder „Alle Rezepte anzeigen“ wählen.";
        listDiv.appendChild(emptyState);
        updateAdminUI();
        return;
    }

    listDiv.classList.add("recipe-grid");

    recipes.forEach((recipe, index) => {
        const recipeDiv = document.createElement("div");
        recipeDiv.className = "recipe recipe-card";
        recipeDiv.classList.add("animate-in");
        recipeDiv.style.animationDelay = `${index * 35}ms`;
        recipeDiv.style.cursor = "pointer";
        recipeDiv.onclick = function(event) {
            if (event.target.closest("button")) {
                return;
            }
            showRecipeDetail(recipe.id);
        };

        const title = document.createElement("h3");
        title.className = "recipe-card-title";
        title.innerText = recipe.title;

        const meta = document.createElement("div");
        meta.className = "recipe-card-meta";
        const servingsBadge = document.createElement("span");
        servingsBadge.className = "recipe-card-badge";
        const n = Array.isArray(recipe.ingredients) ? recipe.ingredients.length : 0;
        servingsBadge.innerText = (recipe.servings || 1) + " Portion" + ((recipe.servings || 1) === 1 ? "" : "en");
        const ingBadge = document.createElement("span");
        ingBadge.className = "recipe-card-badge";
        ingBadge.innerText = n === 1 ? "1 Zutat" : n + " Zutaten";
        meta.appendChild(servingsBadge);
        meta.appendChild(ingBadge);

        const description = document.createElement("p");
        description.className = "recipe-card-preview";
        description.innerText = truncatePreview(recipe.description);

        const ingredientsLine = document.createElement("p");
        ingredientsLine.className = "recipe-card-ingredients";
        ingredientsLine.innerText = ingredientPreviewLine(recipe.ingredients);

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "edit-button admin-only hidden";
        editButton.innerText = "Bearbeiten";
        editButton.onclick = function() {
            edit(recipe.id);
        };

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-button admin-only hidden";
        deleteButton.innerText = "Löschen";
        deleteButton.onclick = function() {
            if (!isAdmin) {
                alert("Bitte zuerst als Admin anmelden.");
                return;
            }
            if (confirm(`Möchtest du das Rezept "${recipe.title}" wirklich löschen?`)) {
                apiFetch(`/delete/${recipe.id}`, { method: "DELETE" })
                    .then(res => {
                        if (res.status === 401) {
                            handleUnauthorized();
                            return null;
                        }
                        return res.json();
                    })
                    .then(data => {
                        if (!data) return;
                        if (data.status === "deleted") {
                            alert("Rezept erfolgreich gelöscht!");
                            loadLetter(currentLetter);
                        } else {
                            alert(data.error || "Fehler beim Löschen des Rezepts.");
                        }
                    });
            }
        };

        recipeDiv.appendChild(title);
        recipeDiv.appendChild(meta);
        recipeDiv.appendChild(description);
        recipeDiv.appendChild(ingredientsLine);
        recipeDiv.appendChild(editButton);
        recipeDiv.appendChild(deleteButton);

        listDiv.appendChild(recipeDiv);
    });
    updateAdminUI();
}

function loadAllRecipes() {
    apiFetch("/recipes")
        .then(res => res.json())
        .then(data => {
            letterWheelCommitted = false;
            hideDetailView();
            render(data);
            updateWheel();
        });
}

function performSearch() {
    const query = document.getElementById("searchInput").value;
    apiFetch(`/search?query=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
            letterWheelCommitted = false;
            hideDetailView();
            render(data);
            updateWheel();
        });
}

document.getElementById("detail-servings-input").addEventListener("input", function(event) {
    const value = parseInt(event.target.value, 10);
    if (!Number.isFinite(value) || value < 1) {
        return;
    }
    renderDetailIngredients(value);
});

document.getElementById("adminPassword").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        adminLogin();
    }
});

buildWheel();
setupLetterWheelKeyboard();
window.addEventListener("resize", function() {
    requestAnimationFrame(function() {
        updateWheel();
    });
});
refreshAdminStatus().then(function() {
    render([]);
    updateWheel();
});
</script>

</body>
</html>
